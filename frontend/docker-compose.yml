version: "3.9"

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - maritime

  # Uncomment if running backend locally too:
  # backend:
  #   image: your-backend-image
