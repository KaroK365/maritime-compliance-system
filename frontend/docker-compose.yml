  #     - SPRING_DATASOURCE_PASSWORD=password
  #   depends_on:
  #     - db
  #   networks:
  #     - maritime

  # db:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: maritime
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - maritime

networks:
  maritime:
    driver: bridge

